# Only the Python orchestrator supplies M8B_RUN; no development env file is read.
x-app: &app
  build:
    context: ../backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://m8b:m8b_disposable_only@db:5432/m8b
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    KAFKA_TOPIC: m8b.${M8B_RUN:?Use python -m benchmarks.performance}
    KAFKA_CONSUMER_GROUP: m8b-${M8B_RUN}
    KAFKA_PARTITIONS: "3"
  networks: [data, broker]
  mem_limit: 384m
  cpus: 1.0
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: m8b
      POSTGRES_USER: m8b
      POSTGRES_PASSWORD: m8b_disposable_only
    tmpfs: [/var/lib/postgresql/data:size=512m]
    networks: [data]
    ports: ["127.0.0.1::5432"]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, pg_isready -U m8b -d m8b]
      interval: 2s
      timeout: 3s
      retries: 30
  redpanda:
    image: redpandadata/redpanda:v24.3.8
    command:
      [
        redpanda,
        start,
        --mode,
        dev-container,
        --smp,
        "1",
        --memory,
        768M,
        --reserve-memory,
        0M,
        --node-id,
        "0",
        --check=false,
        --kafka-addr,
        internal://0.0.0.0:9092,
        --advertise-kafka-addr,
        internal://redpanda:9092,
      ]
    tmpfs: ["/var/lib/redpanda/data:uid=101,gid=101,mode=0755,size=768m"]
    networks: [broker]
    mem_limit: 1280m
    cpus: 1.0
    healthcheck:
      test: [CMD, rpk, cluster, health]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka-init:
    <<: *app
    command: [python, -m, app.kafka_admin]
  backend:
    <<: *app
    ports: ["127.0.0.1::8000"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  consumer:
    <<: *app
    command: [python, -m, app.consumer]
    ports: ["127.0.0.1::8001"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 20s
  frontend:
    build:
      context: ../frontend
    ports: ["127.0.0.1::80"]
    networks: [data]
    mem_limit: 128m
    cpus: 0.5
networks:
  data: {}
  broker: {}
