services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waypoint_smoke
      POSTGRES_USER: waypoint_smoke
      POSTGRES_PASSWORD: waypoint_smoke_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint_smoke -d waypoint_smoke"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    tmpfs:
      - /var/lib/redpanda/data:uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  kafka-init:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://waypoint_smoke:waypoint_smoke_test_only@db:5432/waypoint_smoke
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: waypoint.telemetry
      KAFKA_PARTITIONS: "3"
    command: ["python", "-m", "app.kafka_admin"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://waypoint_smoke:waypoint_smoke_test_only@db:5432/waypoint_smoke
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: waypoint.telemetry
      KAFKA_PARTITIONS: "3"
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://waypoint_smoke:waypoint_smoke_test_only@db:5432/waypoint_smoke
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: waypoint.telemetry
      KAFKA_PARTITIONS: "3"
      KAFKA_METRICS_PORT: "8001"
    command: ["python", "-m", "app.consumer"]
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/metrics', timeout=3)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s
