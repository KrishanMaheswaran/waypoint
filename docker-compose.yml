services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waypoint-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: waypoint-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waypoint_db}
      POSTGRES_USER: ${POSTGRES_USER:-waypoint_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
