global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: waypoint-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: waypoint-consumer
    metrics_path: /metrics
    static_configs:
      - targets:
          - consumer:8001
